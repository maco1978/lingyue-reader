<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' blob: data:; script-src 'self'; style-src 'self' 'unsafe-inline' blob:; img-src 'self' blob: data:; font-src 'self' blob: data:; connect-src 'self' https://api.mosi.cn https://tokenhub.tencentmaas.com https://api.deepseek.com https://api.hunyuan.cloud.tencent.com" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>聆阅看书</title>
    <style>
      /* 键盘焦点始终可见（不依赖各浏览器默认样式） */
      :focus-visible { outline: 2px solid #4a90d9; outline-offset: 2px; }

      /* 视觉隐藏但保留键盘可达：文件选择框不能再用 display:none，否则键盘用户无法导入 */
      .lingyue-sr-only {
        position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
        overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
      }
      .lingyue-file:focus-within { outline: 2px solid #4a90d9; outline-offset: 2px; border-radius: 6px; }

      /* 尊重系统「减少动态效果」 */
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
    <link rel="manifest" href="/lingyue-reader/manifest.webmanifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/lingyue-reader/icon-192.png" />
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
